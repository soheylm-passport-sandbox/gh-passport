name: Test and release gh-passport

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  public-webkit:
    uses: ./.github/workflows/browser-qualification.yml
    permissions:
      contents: read

  test:
    # Retain protected names while explicitly selecting a standard Intel Mac.
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-latest
            runner: macos-26-intel
          - os: windows-latest
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, public-webkit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            asset: gh-passport-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            asset: gh-passport-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: gh-passport-darwin-arm64
          - goos: linux
            goarch: amd64
            asset: gh-passport-linux-amd64
          - goos: linux
            goarch: arm64
            asset: gh-passport-linux-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build a controller-pinned release asset
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CURRICULUM=$(python3 -c 'import json,re; v=json.load(open("SOURCE.json"))["curriculum_version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); print(v)')
          go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION -X main.curriculumVersion=$CURRICULUM" \
            -o "${{ matrix.asset }}" ./cmd/gh-passport
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish immutable platform assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x dist/gh-passport-linux-amd64
          python3 scripts/verify_release_default.py --binary dist/gh-passport-linux-amd64 --tag "${{ github.ref_name }}"
          (cd dist && sha256sum gh-passport-* > SHA256SUMS)
          python scripts/release_notes.py \
            --tag "${{ github.ref_name }}" \
            --output release-notes.md
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
