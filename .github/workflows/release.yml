name: Test and release gh-passport

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            asset: gh-passport-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            asset: gh-passport-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: gh-passport-darwin-arm64
          - goos: linux
            goarch: amd64
            asset: gh-passport-linux-amd64
          - goos: linux
            goarch: arm64
            asset: gh-passport-linux-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - name: Build a controller-pinned release asset
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "${{ matrix.asset }}" ./cmd/gh-passport
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish immutable platform assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum gh-passport-* > SHA256SUMS)
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --notes "Cross-platform IDEAL Lab IT Passport launcher. Verify downloads with SHA256SUMS."
